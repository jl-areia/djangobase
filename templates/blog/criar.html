{% extends 'base.html' %}

{% block title %}Criar Post - FuturoSite{% endblock %}

{% block content %}
<h2>Criar Post</h2>

<form method="POST">
    {% csrf_token %}

    <input type="text" name="titulo" placeholder="Título" required>

    <textarea name="conteudo" placeholder="Conteúdo"></textarea>

    <label>Categoria:</label>
    <select name="categoria">
        <option value="">Selecione</option>
        {% for cat in categorias %}
            <option value="{{ cat.id }}">{{ cat.nome }}</option>
        {% endfor %}
    </select>

    <label>Vídeo (URL)</label>
    <input type="url" name="video_url" placeholder="https://youtube.com/...">

    <label>GIF (URL)</label>
    <input type="url" name="gif_url" placeholder="https://media.giphy.com/...">

    <label>Tags:</label>
    {% for tag in tags %}
        <div>
            <input type="checkbox" name="tags" value="{{ tag.id }}">
            {{ tag.nome }}
        </div>
    {% endfor %}

    <button type="submit">Publicar</button>
</form>

{% endblock %}
