<header class="site-header">
    <a href="{% url 'home' %}" class="brand-shell brand-link">
        <span class="brand-mark">F</span>
        <div>
            <strong>FuturoSite</strong>
            <p>UX moderno em Django</p>
        </div>
    </a>
    <nav class="main-nav">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'sobre' %}">Sobre</a>
        <a href="{% url 'blog' %}">Postagens</a>
        <a href="{% url 'contato' %}">Contato</a>

        {% if user.is_authenticated %}
            <div class="nav-profile">
                <button class="profile-toggle" type="button" aria-haspopup="true">
                    <span class="profile-avatar">{{ user.first_name|default:user.username|slice:":1"|upper }}</span>
                    <span class="profile-name">{{ user.first_name|default:user.username }}</span>
                </button>
                <div class="dropdown-menu">
                    <a href="{% url 'perfil' %}" class="dropdown-item">Perfil</a>
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="dropdown-item dropdown-button">Sair</button>
                    </form>
                </div>
            </div>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
            <a href="{% url 'cadastro' %}" class="cta-button">Cadastrar</a>
        {% endif %}
    </nav>
</header>
